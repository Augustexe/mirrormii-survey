<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genii Gazette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3ecdc; --paper-2: #ebe2cc; --ink: #1d1a24; --ink-soft: #4a4453;
    --violet: #5b3fc4; --rule: #1d1a24; --stamp: #7b5cfa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #d9d0bd; color: var(--ink);
    font-family: "Old Standard TT", Georgia, serif; font-size: 16px; line-height: 1.5;
  }
  .sheet {
    max-width: 1080px; margin: 24px auto; padding: 28px 36px 40px; background: var(--paper);
    background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px);
    background-size: 3px 3px; box-shadow: 0 10px 40px rgba(40,30,10,.25);
  }
  .ears { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .ear { border: 1px solid var(--rule); padding: 6px 10px; max-width: 200px; text-align: center; line-height: 1.3; }
  .mast { font-family: "UnifrakturMaguntia", serif; font-size: clamp(44px, 9vw, 96px); text-align: center; margin: 4px 0 0; line-height: 1; }
  .dateline { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule); padding: 5px 2px; margin-top: 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
  .kicker { font-family: "Special Elite", monospace; color: var(--violet); text-align: center; margin: 22px 0 4px; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; }
  h1.head { font-family: "Playfair Display", serif; font-weight: 900; text-align: center; font-size: clamp(34px, 6.4vw, 72px); line-height: .98; margin: 0; text-transform: uppercase; letter-spacing: -.01em; }
  .deck { font-family: "Playfair Display", serif; font-style: italic; text-align: center; font-size: clamp(18px, 2.2vw, 23px); margin: 12px auto 18px; max-width: 760px; color: var(--ink-soft); }
  .rule-thick { border-top: 4px solid var(--rule); border-bottom: 1px solid var(--rule); height: 7px; margin: 10px 0 18px; }
  .grid { display: grid; grid-template-columns: 1.15fr 2fr 1fr; gap: 0; }
  .col { padding: 0 18px; border-left: 1px solid var(--rule); }
  .col:first-child { border-left: 0; padding-left: 0; }
  .col:last-child { padding-right: 0; }
  h2 { font-family: "Playfair Display", serif; font-weight: 900; font-size: 25px; line-height: 1.05; margin: 0 0 6px; }
  h3 { font-family: "Playfair Display", serif; font-weight: 700; font-size: 19px; line-height: 1.12; margin: 0 0 4px; }
  .byline { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-soft); margin-bottom: 8px; }
  p { margin: 0 0 10px; text-align: justify; hyphens: auto; }
  .dropcap::first-letter { font-family: "Playfair Display", serif; font-weight: 900; float: left; font-size: 58px; line-height: .82; padding: 6px 8px 0 0; }
  .story { padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--rule); }
  .story:last-child { border-bottom: 0; }
  .source { font-style: italic; border-left: 3px solid var(--violet); padding: 2px 0 2px 10px; margin: 6px 0; color: var(--ink); }
  .source small { display: block; font-style: normal; font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-soft); }
  .offrecord { font-family: "Special Elite", monospace; font-size: 13.5px; background: var(--paper-2); padding: 8px 10px; margin-top: 8px; position: relative; }
  .offrecord b { color: #8a1c1c; letter-spacing: .1em; font-weight: 400; display: block; font-size: 11px; }
  .quote-line { font-family: "Playfair Display", serif; font-style: italic; font-size: 17px; margin: 6px 0 0; }
  .gauge { margin: 12px 0 16px; }
  .gauge .ends { display: flex; justify-content: space-between; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
  .gauge .bar { position: relative; height: 12px; border: 1px solid var(--rule); margin: 3px 0 5px;
    background: repeating-linear-gradient(90deg, transparent 0 9.5%, var(--rule) 9.5% 10%); }
  .gauge .needle { position: absolute; top: -6px; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 10px solid var(--violet); transform: translateX(-7px); }
  .gauge .cap { font-size: 14px; font-style: italic; }
  .boxed { border: 2px solid var(--rule); padding: 12px; margin-bottom: 16px; }
  .scoreboard { text-align: center; }
  .scoreboard .big { font-family: "Playfair Display", serif; font-weight: 900; font-size: 64px; line-height: 1; }
  .scoreboard .big span { color: var(--violet); }
  .tally { list-style: none; padding: 0; margin: 10px 0 0; text-align: left; font-size: 13.5px; }
  .tally li { display: grid; grid-template-columns: 22px 1fr; gap: 4px; padding: 5px 0; border-top: 1px dotted var(--ink-soft); }
  .tally .mark { font-weight: 700; }
  .tally .miss { color: #8a1c1c; }
  .tally em { color: var(--ink-soft); }
  .correction { background: var(--paper-2); }
  .correction h3 { text-transform: uppercase; font-size: 15px; letter-spacing: .1em; }
  .classifieds h3 { text-align: center; text-transform: uppercase; letter-spacing: .14em; font-size: 15px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
  .ad-line { font-size: 13.5px; padding: 6px 0; border-bottom: 1px dotted var(--ink-soft); }
  .ad-line b { text-transform: uppercase; font-size: 11px; letter-spacing: .1em; }
  .letters p { font-family: "Playfair Display", serif; font-style: italic; text-align: left; font-size: 17px; }
  .stamp { display: inline-block; font-family: "Special Elite", monospace; color: var(--stamp); border: 2px solid var(--stamp); padding: 2px 8px; transform: rotate(-4deg); font-size: 12px; letter-spacing: .12em; }
  .bottom { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; border-top: 4px double var(--rule); padding-top: 18px; }
  .appad { border: 3px double var(--rule); padding: 18px; text-align: center; background: linear-gradient(#f3ecdc, #efe5d0); }
  .appad .small { font-size: 12px; text-transform: uppercase; letter-spacing: .2em; }
  .appad h2 { font-size: clamp(26px, 3.6vw, 38px); margin: 8px 0; }
  .appad p { text-align: center; max-width: 520px; margin: 0 auto 12px; }
  .btn { display: inline-block; font-family: "Playfair Display", serif; font-weight: 700; font-size: 17px; padding: 10px 22px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); text-decoration: none; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--ink); }
  .wanted { border: 2px solid var(--rule); padding: 16px; text-align: center; }
  .wanted .w { font-family: "Playfair Display", serif; font-weight: 900; font-size: 34px; letter-spacing: .08em; }
  .only-you { font-family: "Special Elite", monospace; font-size: 10px; letter-spacing: .12em; color: #8a1c1c; }
  .fold { text-align: center; font-size: 11px; letter-spacing: .3em; color: var(--ink-soft); margin: 16px 0 6px; }
  @media (max-width: 820px) {
    .sheet { margin: 0; padding: 16px 16px 28px; box-shadow: none; }
    .ears .ear:last-child { display: none; }
    .grid, .bottom { grid-template-columns: 1fr; }
    .col { border-left: 0; padding: 0; border-top: 1px solid var(--rule); padding-top: 14px; margin-top: 14px; }
    .col:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
    p { text-align: left; }
  }
</style>
</head>
<body>
<div class="sheet" id="app"></div>
<script src="data.js"></script>
<script>
const D = window.DEMO;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const gradeWord = { did: "What you did", would: "What you'd do", believe: "What you believe" };
const gauge = (a) => {
  const pct = ((a.pos * (a.pole === a.right ? 1 : -1)) + 1) / 2 * 100;
  return `<div class="gauge"><div class="ends"><span>${a.left}</span><span>${a.right}</span></div>
    <div class="bar"><div class="needle" style="left:${pct}%"></div></div>
    <div class="cap">${esc(a.line)}</div></div>`;
};
const today = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
const [lead, ...rest] = D.tags;
document.getElementById("app").innerHTML = `
  <div class="ears">
    <div class="ear">Special edition<br>printed for one reader</div>
    <div class="ear">${D.answered} moments on the record</div>
  </div>
  <div class="mast">The Genii Gazette</div>
  <div class="dateline"><span>${today}</span><span>Vol. I, No. 1</span><span>Price: one honest afternoon</span></div>

  <div class="kicker">Genii's island bureau reports</div>
  <h1 class="head">${esc(D.name)}</h1>
  <div class="deck">${esc(D.halves[0].desc)} ${esc(D.halves[1].desc)}</div>
  <div class="rule-thick"></div>

  <div class="grid">
    <div class="col">
      <h2>The Two Halves of the Story</h2>
      <div class="byline">Genii's desk, measured across 7 chapters</div>
      ${D.halves.map((h) => `
        <h3>${esc(h.side)}: ${esc(h.word)}</h3>
        ${h.axes.map(gauge).join("")}`).join("")}
      <div class="boxed letters">
        <h3>Letters to the Editor</h3>
        ${D.hearts.map((x) => `<p>"${esc(x)}"</p>`).join("")}
        <div class="byline">Signed, the subject</div>
      </div>
    </div>

    <div class="col">
      <div class="story">
        <div class="byline">Front page · ${lead.strength} · ${esc(lead.chapter)}</div>
        <h2>${esc(lead.name)}</h2>
        <p class="dropcap">${esc(lead.heart)} Sources close to the subject paint a consistent picture, and they are on the record.</p>
        ${lead.told.map((t) => `<div class="source">"${esc(t.said)}"<small>${gradeWord[t.grade]} · ${esc(t.ch)}</small></div>`).join("")}
        <div class="offrecord"><b>OFF THE RECORD <span class="only-you">(ONLY YOU SEE THIS)</span></b>${esc(lead.sting)}</div>
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        ${rest.map((t, i) => `
          <div class="col" style="${i % 2 === 0 ? "border-left:0;padding-left:0" : ""}">
            <div class="story">
              <div class="byline">${t.strength} · ${esc(t.chapter)}</div>
              <h3>${esc(t.name)}</h3>
              <p class="quote-line">${esc(t.heart)}</p>
              ${t.told.slice(0, 2).map((x) => `<div class="source">"${esc(x.said)}"<small>${gradeWord[x.grade]}</small></div>`).join("")}
              <div class="offrecord"><b>OFF THE RECORD</b>${esc(t.sting)}</div>
            </div>
          </div>`).join("")}
      </div>
    </div>

    <div class="col">
      <div class="boxed scoreboard">
        <h3>Genii's Guesses</h3>
        <div class="byline">Written down before you answered</div>
        <div class="big"><span>${D.guesses.exact}</span>/${D.guesses.of}</div>
        <div style="font-size:13px">called exactly. Chance: about 2 in 8.</div>
        <ul class="tally">
          ${D.guesses.rows.map((r) => `<li><span class="mark ${r.hit ? "" : "miss"}">${r.hit ? "✓" : "✗"}</span><span><b>${esc(r.topic)}.</b> ${r.hit ? esc(r.guess) : `Genii said <em>${esc(r.guess)}</em> You: ${esc(r.answer)}`}</span></li>`).join("")}
        </ul>
      </div>
      <div class="boxed correction">
        <h3>Correction <span class="only-you">(only you)</span></h3>
        <p>An earlier edition quoted the subject as saying: <i>"${esc(D.twist.say)}"</i> Put on the spot, the subject went with: <i>${esc(D.twist.did)}</i> The Gazette regrets nothing.</p>
      </div>
      <div class="classifieds">
        <h3>Classifieds</h3>
        ${D.calls.map((c, i) => `<div class="ad-line"><b>Genii bets, No. ${i + 1}.</b> ${esc(c)}</div>`).join("")}
        <div style="text-align:center;margin-top:12px"><span class="stamp">For fun. Not a diagnosis.</span></div>
      </div>
    </div>
  </div>

  <div class="fold">· · · continued in the app · · ·</div>
  <div class="bottom">
    <div class="appad">
      <div class="small">Now appearing on Genii's island</div>
      <h2>${esc(D.app.head)}</h2>
      <p>${esc(D.app.body)}</p>
      <a class="btn">${esc(D.app.button)}</a>
    </div>
    <div class="wanted">
      <div class="w">WANTED</div>
      <p style="text-align:center">One friend who claims to really know the subject. Must guess the headline. Reward: bragging rights.</p>
      <a class="btn ghost">${esc(D.invite)}</a>
    </div>
  </div>
`;
</script>
</body>
</html>
