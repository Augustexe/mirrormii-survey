<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirror Magazine</title>
<meta name="description" content="Concept A for the MirrorMii Evidence Article: your result as a glossy cover story.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,200..800,0..100,0..1;1,9..144,200..800,0..100,0..1&family=Figtree:wght@400..800&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F8F8FF; --paper-2: #EFEDFC; --pearl: #E9E6FB; --ink: #1E1B2E; --ink-2: #4A4560; --ink-3: #6E6987;
  --line: #E2DEF7; --violet: #8071E4; --vt: #5646C0; --deep: #6A5AD6; --night: #171625; --night-2: #2A2744; --n-ink: #F3F1FF; --n-ink-2: #C9C4EE; --n-violet: #A99CF5;
  --rose: #F2A7C3; --sky: #8FB8F2; --peach: #F4B8A0; --butter: #F2D48A; --mint: #96D8C4; --lilac: #C9B3F0; --aqua: #8EDBE6;
  --g-brand: linear-gradient(135deg, #988DEA, #5B8BEB);
  --serif: "Fraunces", Georgia, serif; --sans: "Figtree", system-ui, sans-serif;
  --gut: 16px; --col: 34rem;
  --e-out: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 110px; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.62 var(--sans); overflow-x: hidden; }
img { display: block; max-width: 100%; height: auto; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--vt); outline-offset: 3px; border-radius: 6px; }
.serif { font-family: var(--serif); font-variation-settings: "SOFT" 100, "WONK" 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.bar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 10px var(--gut); background: rgba(248,248,255,.78); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); border-bottom: 1px solid rgba(226,222,247,.7); }
.bar img { height: 18px; width: auto; }
.secnav { position: sticky; top: 55px; z-index: 29; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 6px var(--gut); background: rgba(248,248,255,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(226,222,247,.7); -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); }
.secnav a { flex: none; padding: 7px 11px; min-height: 34px; border-radius: 999px; font: 650 12.5px/1.5 var(--sans); color: var(--ink-2); text-decoration: none; }
.secnav a.on { background: var(--pearl); color: var(--vt); }
.bar .prog { position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%; background: var(--g-brand); transform-origin: 0 50%; transform: scaleX(0); }
.voice { margin-left: auto; display: flex; padding: 3px; border-radius: 999px; background: #fff; border: 1px solid var(--line); }
.voice button { border: 0; background: transparent; padding: 7px 11px; border-radius: 999px; font: 650 12.5px/1 var(--sans); color: var(--ink-2); cursor: pointer; min-height: 34px; }
.voice button[aria-checked="true"] { background: var(--ink); color: #fff; }

/* cover */
.cover { position: relative; min-height: calc(100svh - 55px); padding: 18px var(--gut) 28px; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; background: radial-gradient(120% 70% at 50% 40%, #fff 0%, var(--paper) 45%, var(--paper-2) 100%); }
.mast { font-family: var(--serif); font-variation-settings: "SOFT" 100, "WONK" 0; font-weight: 250; font-size: clamp(88px, 29vw, 330px); line-height: .78; letter-spacing: -.055em; text-align: center; margin: 0; color: var(--ink); position: relative; z-index: 1; white-space: nowrap; }
.mast span { display: inline-block; }
.issue { display: flex; justify-content: space-between; font: 600 12px/1.3 var(--sans); color: var(--ink-3); margin-top: 8px; position: relative; z-index: 3; }
.arch { position: relative; z-index: 2; justify-self: center; width: min(74vw, 440px); aspect-ratio: 526 / 700; margin-top: calc(-1 * clamp(40px, 12vw, 150px)); border-radius: 999px 999px 28px 28px; padding: 9px; background: linear-gradient(160deg, rgba(255,255,255,.95), rgba(233,230,251,.6) 40%, rgba(152,141,234,.45)); box-shadow: 0 40px 80px -30px rgba(86,70,192,.45), 0 0 0 1px rgba(255,255,255,.9) inset; }
.arch .glass { position: relative; height: 100%; border-radius: 999px 999px 20px 20px; overflow: hidden; background: #dcd8f6; }
.arch .glass img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.08); transition: transform 1.6s var(--e-out); }
.arch .spec { position: absolute; inset: -20%; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.55) 47%, rgba(255,255,255,.08) 55%, transparent 62%); transform: translateX(var(--sx, -30%)); mix-blend-mode: soft-light; pointer-events: none; }
.arch .fog { position: absolute; inset: 0; background: rgba(248,248,255,.8); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: opacity 1.4s var(--e-out) .2s; }
.loaded .arch .fog { opacity: 0; }
.loaded .arch .glass img { transform: scale(1); }
.genii { position: absolute; z-index: 4; width: 96px; right: calc(13vw - 30px); top: 150px; filter: drop-shadow(0 18px 24px rgba(86,70,192,.35)); animation: bob 6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-3deg); } }
.coverline { position: relative; z-index: 3; margin-top: -96px; padding: 14px 0 0; }
.coverline::before { content: ""; position: absolute; inset: -30px calc(-1 * var(--gut)) -200px; background: linear-gradient(180deg, rgba(248,248,255,0), rgba(248,248,255,.94) 90px); z-index: -1; }
.coverline .lab { font: 650 12px/1 var(--sans); letter-spacing: .02em; color: var(--vt); display: block; margin: 0 0 4px; }
.coverline h1 { margin: 0; font-family: var(--serif); font-variation-settings: "SOFT" 100, "WONK" 0; font-weight: 640; font-size: clamp(44px, 12.6vw, 104px); line-height: .9; letter-spacing: -.035em; text-wrap: balance; }
.coverline h1 .l2 { display: block; font-style: italic; font-weight: 380; font-variation-settings: "SOFT" 100, "WONK" 1; margin-top: 10px; }
.coverline h1 .lab { margin-top: 6px; }
.covertags { position: relative; z-index: 3; list-style: none; padding: 0; margin: 16px 0 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font: 650 14px/1.3 var(--sans); color: var(--ink-2); }
.covertags li::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--violet); margin-right: 7px; vertical-align: 2px; }

/* type and flow */
.wrap { padding: 0 var(--gut); max-width: 1240px; margin: 0 auto; }
section { padding: 56px 0; }
.kick { font: 650 13px/1.2 var(--sans); color: var(--vt); margin: 0 0 12px; }
h2 { font-family: var(--serif); font-variation-settings: "SOFT" 100, "WONK" 0; font-weight: 560; font-size: clamp(34px, 9vw, 64px); line-height: 1; letter-spacing: -.028em; margin: 0 0 16px; text-wrap: balance; }
.intro { font-size: 18px; line-height: 1.55; color: var(--ink-2); max-width: var(--col); margin: 0 0 28px; text-wrap: pretty; }
.dek { font-family: var(--serif); font-style: italic; font-variation-settings: "SOFT" 100, "WONK" 1; font-weight: 360; font-size: clamp(24px, 6.4vw, 40px); line-height: 1.2; letter-spacing: -.012em; margin: 0 0 28px; max-width: 22em; text-wrap: balance; }
.body p { max-width: var(--col); margin: 0 0 18px; text-wrap: pretty; }
.drop::first-letter { font-family: var(--serif); font-weight: 600; float: left; font-size: 78px; line-height: .8; padding: 8px 10px 0 0; color: var(--vt); }
.pull { position: relative; margin: 34px 0; padding: 0; font-family: var(--serif); font-variation-settings: "SOFT" 100, "WONK" 0; font-weight: 460; font-size: clamp(27px, 7.4vw, 46px); line-height: 1.12; letter-spacing: -.018em; text-wrap: balance; max-width: 18em; }
.pull::before { content: "\201C"; position: absolute; left: -4px; top: -.55em; font-size: 2.6em; color: var(--pearl); z-index: -1; }
.save { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 14px; font: 650 13px/1 var(--sans); color: var(--vt); cursor: pointer; min-height: 40px; }
.save svg { width: 15px; height: 15px; }

/* contents */
.toc { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--ink); }
.toc a { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
.toc b { font-family: var(--serif); font-weight: 560; font-size: 22px; line-height: 1.15; letter-spacing: -.01em; }
.toc span { grid-column: 1; font-size: 14.5px; color: var(--ink-3); line-height: 1.4; }
.toc i { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-style: normal; color: var(--vt); font-size: 20px; }

/* stat spreads */
.stats { display: grid; gap: 14px; }
.spread { perspective: 1400px; }
.card { position: relative; display: grid; transform-style: preserve-3d; transition: transform .7s var(--e-out); }
.spread.flipped .card { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; position: relative; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 28px; padding: 22px 20px 20px; display: flex; flex-direction: column; overflow: hidden; }
.front { background: #fff; box-shadow: 0 1px 2px rgba(23,22,37,.05), 0 0 0 1px var(--line), 0 24px 50px -30px rgba(86,70,192,.35); }
.back { transform: rotateY(180deg); background: var(--night); color: var(--n-ink); }
.statname { font-family: var(--serif); font-weight: 300; font-size: 46px; line-height: .85; letter-spacing: -.05em; color: transparent; -webkit-text-stroke: 1.2px var(--violet); margin: 0 0 14px; }
.back .statname { -webkit-text-stroke-color: var(--n-violet); }
.ends { display: flex; justify-content: space-between; font: 650 13px/1.2 var(--sans); color: var(--ink-3); }
.ends .me { color: var(--ink); }
.back .ends { color: var(--n-ink-2); }
.back .ends .me { color: #fff; }
.pips { display: flex; gap: 6px; margin: 8px 0 4px; }
.pips i { flex: 1; height: 8px; border-radius: 99px; background: var(--pearl); }
.pips i.on { background: var(--g-brand); }
.pips i.half { background: linear-gradient(90deg, var(--violet) 50%, var(--pearl) 50%); }
.back .pips i { background: rgba(255,255,255,.14); }
.back .pips i.on { background: linear-gradient(90deg, #cfc8ff, #9fb8ff); }
.leadend { font-family: var(--serif); font-weight: 600; font-size: 30px; letter-spacing: -.02em; line-height: 1; margin: 14px 0 2px; }
.level { font: 650 13px/1.2 var(--sans); color: var(--vt); }
.back .level { color: var(--n-violet); }
.note { font-size: 16.5px; line-height: 1.5; margin: 12px 0 0; color: var(--ink-2); }
.back .note { color: var(--n-ink-2); }
.face .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 14px; }
.turn { border: 0; background: var(--paper-2); color: var(--vt); border-radius: 999px; padding: 9px 14px; font: 650 13px/1 var(--sans); cursor: pointer; min-height: 40px; }
.back .turn { background: rgba(255,255,255,.1); color: #fff; }
.ribbon { position: absolute; top: 18px; right: -34px; transform: rotate(35deg); background: var(--ink); color: #fff; font: 700 11px/1 var(--sans); letter-spacing: .03em; padding: 7px 40px; }
.ribbon.wild { background: var(--rose); color: var(--ink); }
.ribnote { font-size: 13.5px; color: var(--ink-3); margin: 8px 0 0; font-style: italic; }
.knows { font-family: var(--serif); font-style: italic; font-variation-settings: "SOFT" 100, "WONK" 1; font-weight: 400; font-size: 18px; line-height: 1.35; margin: 14px 0 0; color: var(--ink); }

/* core traits */
.core { list-style: none; padding: 0; margin: 0; counter-reset: c; }
.core li { display: grid; grid-template-columns: 1fr; gap: 4px; padding: 20px 0; border-top: 1px solid var(--line); }
.core li:first-child { border-top: 1px solid var(--ink); }
.core .kw { font-family: var(--serif); font-weight: 580; font-size: 34px; line-height: 1; letter-spacing: -.025em; }
.core .ln { margin: 6px 0 0; color: var(--ink-2); max-width: var(--col); }
.core .from { font: 600 13px/1.3 var(--sans); color: var(--ink-3); }
.core .from b { color: var(--vt); font-weight: 650; }

/* insight */
.night { background: var(--night); color: var(--n-ink); position: relative; overflow: hidden; }
.night .kick { color: var(--n-violet); }
.night::before { content: ""; position: absolute; width: 520px; height: 520px; left: 50%; top: 40%; transform: translate(-50%, -50%); background: radial-gradient(closest-side, rgba(169,156,245,.35), rgba(128,113,228,0)); pointer-events: none; }
.insight { position: relative; padding-top: 88px; padding-bottom: 88px; }
.belief { font-family: var(--serif); font-weight: 520; font-size: clamp(34px, 9.6vw, 72px); line-height: 1.02; letter-spacing: -.03em; margin: 0; max-width: 14em; text-wrap: balance; }
.behav { font-family: var(--serif); font-style: italic; font-variation-settings: "SOFT" 100, "WONK" 1; font-weight: 330; font-size: clamp(24px, 6.6vw, 44px); line-height: 1.18; margin: 22px 0 0; max-width: 18em; color: var(--n-ink-2); text-wrap: balance; }
.insight .genii2 { width: 96px; margin: 34px 0 0; filter: drop-shadow(0 0 30px rgba(169,156,245,.6)); }

/* rooms */
.roomhero { position: relative; margin: 0 calc(-1 * var(--gut)) 10px; }
.roomhero img { width: 100%; height: auto; }
.rooms { display: grid; gap: 0; }
.room { display: grid; grid-template-columns: 14px 1fr; gap: 0 14px; padding: 18px 0; border-top: 1px solid var(--line); }
.room .dot { width: 14px; height: 14px; border-radius: 50%; margin-top: 8px; }
.room h3 { font-family: var(--serif); font-weight: 580; font-size: 26px; line-height: 1.1; margin: 0 0 6px; letter-spacing: -.015em; }
.room p { margin: 0 0 8px; max-width: var(--col); }
.room .tagline { font: 650 12.5px/1 var(--sans); color: var(--ink-3); }
.flipbox { margin: 22px 0 0; border-radius: 28px; padding: 22px; background: linear-gradient(150deg, #fff, var(--pearl)); box-shadow: 0 0 0 1px var(--line); }
.flipbox h3 { font-family: var(--serif); font-weight: 600; font-size: 24px; margin: 0 0 8px; }
.flipbox .big { font-family: var(--serif); font-style: italic; font-variation-settings: "SOFT" 100, "WONK" 1; font-size: 22px; line-height: 1.3; margin: 0 0 8px; }

/* sides */
.sides { display: grid; gap: 14px; }
.side { border-radius: 28px; padding: 22px; }
.side.team { background: linear-gradient(160deg, #EAF6F2, #F2F0FF); }
.side.clash { background: linear-gradient(160deg, #FDEEF4, #F2F0FF); }
.side .pair { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-weight: 600; font-size: 22px; letter-spacing: -.01em; margin: 6px 0 10px; flex-wrap: wrap; }
.side .pair em { font-style: normal; font: 700 18px/1 var(--sans); color: var(--ink-3); }
.side .lab2 { font: 650 13px/1 var(--sans); color: var(--vt); }
.side p { margin: 0; font-size: 18px; line-height: 1.5; }
.side small { display: block; margin-top: 10px; font: 600 12.5px/1.3 var(--sans); color: var(--ink-3); }

/* open book */
.column { display: grid; gap: 28px; }
.column .col-h { display: flex; align-items: center; gap: 12px; }
.column .col-h img { width: 54px; height: 54px; border-radius: 50%; background: var(--pearl); padding: 6px; object-fit: contain; }
.sting { font-family: var(--serif); font-weight: 420; font-size: 23px; line-height: 1.3; margin: 0 0 18px; padding-left: 18px; border-left: 2px solid var(--rose); max-width: 24em; }
.hearts { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.hearts li { font-family: var(--serif); font-style: italic; font-variation-settings: "SOFT" 100, "WONK" 1; font-size: 21px; line-height: 1.3; }
.hearts li small { display: block; font: 600 12px/1.4 var(--sans); font-style: normal; color: var(--ink-3); margin-top: 2px; }

/* record */
.record { display: grid; gap: 22px; }
.score { font-family: var(--serif); font-weight: 250; font-size: clamp(120px, 38vw, 240px); line-height: .8; letter-spacing: -.06em; margin: 0; color: var(--ink); }
.score sub { font-size: .32em; vertical-align: baseline; letter-spacing: -.02em; font-weight: 500; color: var(--ink-3); margin-left: 6px; }
.calls { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.calls li { border-radius: 18px; padding: 12px 12px 10px; background: #fff; box-shadow: 0 0 0 1px var(--line); min-height: 86px; display: flex; flex-direction: column; justify-content: space-between; }
.calls li b { font-family: var(--serif); font-weight: 560; font-size: 16.5px; line-height: 1.15; }
.calls li span { font: 650 12px/1.2 var(--sans); color: var(--ink-3); margin-top: 8px; display: flex; gap: 6px; align-items: center; }
.calls li.hit { background: linear-gradient(160deg, #fff, var(--pearl)); }
.calls li.hit span { color: var(--vt); }
.calls li span::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--violet); }
.calls li.near span::before { background: linear-gradient(90deg, var(--violet) 50%, var(--line) 50%); }
.calls li.miss span::before { background: var(--rose); }

/* party + bio */
.party { display: grid; gap: 14px; }
.slot { border-radius: 28px; padding: 22px; background: #fff; box-shadow: 0 0 0 1px var(--line); }
.slot .lab2 { font: 650 13px/1 var(--sans); color: var(--vt); }
.slot h3 { font-family: var(--serif); font-weight: 600; font-size: 32px; line-height: 1; letter-spacing: -.02em; margin: 8px 0 8px; }
.slot p { margin: 0; color: var(--ink-2); }
.slot.opp { background: var(--night); color: var(--n-ink); box-shadow: none; }
.slot.opp .lab2 { color: var(--n-violet); }
.slot.opp p { color: var(--n-ink-2); }
.bio { display: flex; flex-direction: column; gap: 12px; border-radius: 28px; padding: 22px; background: var(--g-brand); color: var(--ink); }
.bio q { font-family: var(--serif); font-weight: 560; font-size: 24px; line-height: 1.2; quotes: none; }
.bio button { align-self: flex-start; border: 0; background: #fff; color: var(--ink); border-radius: 999px; padding: 10px 16px; font: 700 14px/1 var(--sans); cursor: pointer; min-height: 44px; }

/* close + share + app */
.closing { font-family: var(--serif); font-size: clamp(26px, 7vw, 44px); line-height: 1.15; letter-spacing: -.02em; max-width: 18em; margin: 0 0 28px; text-wrap: balance; }
.sharecard { width: min(100%, 320px); aspect-ratio: 9 / 16; border-radius: 30px; padding: 22px 18px; background: radial-gradient(120% 80% at 50% 20%, #3A3470, var(--night)); color: #fff; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 40px 80px -30px rgba(23,22,37,.6); margin: 0 auto; position: relative; overflow: hidden; }
.sharecard .sarch { width: 78%; aspect-ratio: 3 / 4.2; border-radius: 999px 999px 18px 18px; padding: 5px; background: linear-gradient(160deg, #fff, #b9b1f3); margin: 12px 0 14px; }
.sharecard .sarch div { height: 100%; border-radius: 999px 999px 14px 14px; background: url(assets/mirror-world-320.webp) center/cover; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 12px; }
.sharecard .nm { font-family: var(--serif); font-weight: 650; font-size: 26px; line-height: .95; color: var(--ink); text-shadow: 0 1px 12px rgba(255,255,255,.9); }
.sharecard .nm small { display: block; font: 700 9px/1 var(--sans); letter-spacing: .06em; color: var(--vt); margin-bottom: 4px; text-shadow: none; }
.sharecard .chips { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
.sharecard .chips span { font: 650 11px/1 var(--sans); padding: 6px 9px; border-radius: 99px; background: rgba(255,255,255,.14); }
.sharecard .inv { font-family: var(--serif); font-style: italic; margin-top: auto; color: #d8d2ff; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; justify-content: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 14px 22px; min-height: 52px; font: 700 16px/1 var(--sans); cursor: pointer; text-decoration: none; }
.btn.primary { background: linear-gradient(135deg, #5A4ED6, #4A63D3); color: #fff; box-shadow: 0 14px 30px -12px rgba(74,99,211,.7); }
.btn.ghost { background: #fff; color: var(--vt); box-shadow: 0 0 0 1px var(--line); }
.app { position: relative; border-radius: 36px; overflow: hidden; background: linear-gradient(180deg, #CFC8F8, #A9B8F5 60%, #8A9BEB); padding: 26px 20px 24px; color: var(--ink); }
.app img.isl { width: 118%; max-width: none; margin: 0 -9% 8px; }
.app h2 { font-size: clamp(32px, 8.6vw, 56px); }
.app p { margin: 0 0 18px; max-width: 30em; }
.app .g { position: absolute; width: 92px; right: 18px; top: 18px; animation: bob 6s ease-in-out infinite; }
.store { display: inline-flex; align-items: center; gap: 10px; background: var(--ink); color: #fff; border-radius: 16px; padding: 10px 18px; text-decoration: none; min-height: 52px; }
.store small { display: block; font: 500 11px/1 var(--sans); opacity: .8; }
.store b { font: 700 17px/1.1 var(--sans); }
.foot { padding: 30px var(--gut) 60px; text-align: center; font-size: 13px; color: var(--ink-3); }
.foot a { color: var(--vt); }

/* story preview overlay */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(23,22,37,.72); backdrop-filter: blur(8px); display: grid; place-items: center; padding: 20px; }
.overlay[hidden] { display: none; }
.story { width: min(86vw, 340px); aspect-ratio: 9 / 16; border-radius: 30px; background: radial-gradient(110% 70% at 50% 30%, #fff, var(--pearl) 60%, #C9C2F6); padding: 28px 22px; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
.story p { font-family: var(--serif); font-weight: 520; font-size: 28px; line-height: 1.15; letter-spacing: -.02em; margin: 0; }
.story img { width: 90px; position: absolute; bottom: 70px; right: 18px; }
.story small { position: absolute; bottom: 24px; left: 22px; font: 700 11px/1 var(--sans); color: var(--vt); }
.overlay .x { position: absolute; top: 16px; right: 16px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: #fff; font-size: 22px; cursor: pointer; }

.fade { transition: opacity .28s ease; }
.swapping .fade { opacity: .15; }

@media (min-width: 760px) {
  :root { --gut: 40px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .sides, .party { grid-template-columns: 1fr 1fr; }
  .calls { grid-template-columns: repeat(4, 1fr); }
  .core { display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; }
  .core li:nth-child(2) { border-top: 1px solid var(--ink); }
}
@media (min-width: 1100px) {
  body { font-size: 18px; }
  .cover { grid-template-columns: 1fr minmax(0, 420px) 1fr; grid-template-rows: auto auto 1fr; column-gap: 48px; padding: 20px 56px 56px; min-height: calc(100vh - 62px); }
  .issue { grid-column: 1 / -1; grid-row: 1; margin: 0 0 6px; }
  .mast { grid-column: 1 / -1; grid-row: 2; font-size: 240px; }
  .arch { grid-column: 2; grid-row: 3; width: 88%; margin-top: -120px; }
  .coverline { grid-column: 1; grid-row: 3; align-self: end; margin: 0 0 30px; }
  .coverline h1 { font-size: 66px; }
  .covertags { grid-column: 3; grid-row: 3; align-self: end; flex-direction: column; margin: 0 0 34px; font-size: 18px; gap: 12px; }
  .covertags li { font-family: var(--serif); font-weight: 500; font-size: 22px; }
  .genii { width: 140px; right: calc(50% - 330px); top: 250px; }
  .coverline::before { display: none; }
  .lede { display: grid; grid-template-columns: 1.1fr .9fr; gap: 64px; align-items: start; }
  .stats { grid-template-columns: repeat(3, 1fr); }
  .record { grid-template-columns: .8fr 1.2fr; align-items: end; }
  .column { grid-template-columns: 1.1fr .9fr; gap: 64px; }
  .roomwrap { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start; }
  .roomhero { margin: 0; position: sticky; top: 90px; }
  .roomhero img { border-radius: 36px; }
  .endgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
  .app { padding: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
  .app img.isl { grid-column: 2; grid-row: 1 / span 4; width: 130%; margin: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  .arch .fog { opacity: 0; }
}
@media (prefers-reduced-transparency: reduce) {
  .bar { background: var(--paper); backdrop-filter: none; }
}
</style>
</head>
<body>
<header class="bar">
  <img src="assets/mirrormii-wordmark.svg" alt="MirrorMii">
  <div class="voice" id="voice"></div>
  <div class="prog" id="prog" aria-hidden="true"></div>
</header>
<nav class="secnav" id="secnav" aria-label="Sections"></nav>
<main id="main" aria-live="polite"></main>
<div class="overlay" id="ov" hidden role="dialog" aria-modal="true" aria-label="Story preview">
  <button class="x" id="ovx" aria-label="Close">&times;</button>
  <div class="story" id="story"></div>
</div>
<script type="module">
import { loadData, buildArticle, esc, pipsHTML, getVoice, mountVoiceSwitch, reducedMotion } from "./shared.js";
const data = await loadData();
let voice = getVoice();
const main = document.getElementById("main");
const tint = { 1: "var(--sky)", 2: "var(--peach)", 3: "var(--rose)", 4: "var(--butter)", 5: "var(--mint)", 6: "var(--lilac)", 7: "var(--aqua)" };
const saveIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M12 7v7M9 11l3 3 3-3"/></svg>`;

function render(A) {
  const c = A.cover;
  const r = A.record;
  const sheet = A.sheet.rows.map((s, i) => `
    <div class="spread" data-i="${i}">
      <div class="card">
        <div class="face front">
          ${s.badge ? `<span class="ribbon ${s.badge === "wild" ? "wild" : ""}">${esc(s.badgeLabel)}</span>` : ""}
          <p class="statname" aria-hidden="true">${esc(s.stat)}</p>
          <h3 class="sr">${esc(s.stat)}</h3>
          <div class="ends"><span class="${s.leadSide === "a" ? "me" : ""}">${esc(s.a)}</span><span class="${s.leadSide === "b" ? "me" : ""}">${esc(s.b)}</span></div>
          ${pipsHTML(s.pips, s.flex)}
          <p class="leadend">${esc(s.flex ? `${s.a} and ${s.b}` : s.leadEnd)}</p>
          <span class="level">${esc(s.level)}</span>
          <p class="note">${esc(s.note)}</p>
          ${s.know && !s.inCore && s.know !== A.cover.hook ? `<p class="knows">${esc(s.know)}</p>` : ""}
          ${s.badgeNote ? `<p class="ribnote">${esc(s.badgeNote)}</p>` : ""}
          <div class="foot"><span class="level">${esc(A.sheet.yours)}</span>${s.flex ? "" : `<button class="turn" aria-expanded="false">${esc(A.sheet.showOther)}</button>`}</div>
        </div>
        ${s.flex ? "" : `<div class="face back" aria-hidden="true">
          <p class="statname">${esc(s.stat)}</p>
          <div class="ends"><span class="${s.leadSide === "b" ? "me" : ""}">${esc(s.a)}</span><span class="${s.leadSide === "a" ? "me" : ""}">${esc(s.b)}</span></div>
          <p class="level" style="margin:0">${esc(A.sheet.yours)}: ${esc(s.leadEnd)}, ${esc(s.level.toLowerCase())}</p>
          <p class="leadend">${esc(s.otherEnd)}</p>
          <span class="level">${esc(A.sheet.other)}</span>
          <p class="note">${esc(s.otherLine)}</p>
          <div class="foot"><span class="level">${esc(A.sheet.other)}</span><button class="turn">${esc(A.sheet.yours)}</button></div>
        </div>`}
      </div>
    </div>`).join("");
  const toc = [
    ["sheet", A.sheet.title, A.sheet.rows.find((s) => s.badge === "signature")?.note],
    ["core", A.core.title, A.core.items.map((k) => k.keyword).join(", ")],
    ["insight", A.insight.kicker, A.insight.belief],
    ["rooms", A.rooms.kicker, A.rooms.flip ? A.rooms.flip.sentence : A.rooms.intro],
    ["book", A.stings.title, A.stings.lines[0]],
    ["record", A.record ? A.record.headline : "", ""],
  ].filter((x) => x[1]);
  return `
  <article>
  <section class="cover" aria-label="Cover">
    <p class="mast" aria-hidden="true"><span>Mirror</span></p>
    <div class="issue"><span>${esc(c.issue)}</span><span>${esc(A.readTime)}</span></div>
    <div class="arch" id="arch"><div class="glass"><img src="assets/mirror-world-526.webp" alt="" width="526" height="842" fetchpriority="high"><div class="spec"></div><div class="fog"></div></div></div>
    <img class="genii" src="assets/genii-240.webp" srcset="assets/genii-240.webp 240w, assets/genii-480.webp 480w" sizes="170px" alt="" width="240" height="216">
    <div class="coverline">
      <h1><span class="lab">${esc(c.people.label)}</span>${esc(c.people.name)}<span class="l2"><span class="lab">${esc(c.life.label)}</span>${esc(c.life.name)}</span></h1>
    </div>
    <ul class="covertags" aria-label="Core traits">${c.keywords.map((k) => `<li>${esc(k)}</li>`).join("")}</ul>
  </section>

  <div class="wrap">
  <section class="lede fade">
    <div>
      <p class="dek">${esc(c.dek)}</p>
      <p class="kick">${esc(A.lede.title)}</p>
      <div class="body">
        <p class="drop">${esc(A.lede.bodies[0] || A.lede.lines[0])}</p>
        <p>${esc(A.lede.bodies[1] || A.lede.lines[1])}</p>
      </div>
    </div>
    <div>
      <blockquote class="pull" data-quote="${esc(c.hook)}">${esc(c.hook)}</blockquote>
      <button class="save" data-save="${esc(c.hook)}">${saveIcon}${esc(A.labels.save)}</button>
    </div>
  </section>

  <section class="fade" aria-labelledby="toc-h">
    <h2 id="toc-h" class="kick" style="font-family:var(--sans);font-size:13px;letter-spacing:0">${esc(A.labels.contents)}</h2>
    <ol class="toc">${toc.map(([id, t, s]) => `<li><a href="#${id}"><b>${esc(t)}</b>${s ? `<span>${esc(s)}</span>` : ""}<i aria-hidden="true">&#8595;</i></a></li>`).join("")}</ol>
  </section>

  <section id="sheet" class="fade">
    <p class="kick">${esc(A.sheet.kicker)}</p>
    <h2>${esc(A.sheet.title)}</h2>
    <p class="intro">${esc(A.sheet.intro)}</p>
    <div class="stats">${sheet}</div>
  </section>

  <section id="core" class="fade">
    <p class="kick">${esc(A.core.kicker)}</p>
    <h2>${esc(A.core.title)}</h2>
    <ul class="core">${A.core.items.map((k) => `<li><span class="kw">${esc(k.keyword)}</span><p class="ln">${esc(k.line)}</p><span class="from">${esc(A.core.fromLabel)}: <b>${esc(k.from)}</b></span></li>`).join("")}</ul>
  </section>
  </div>

  <section id="insight" class="night fade">
    <div class="wrap insight">
      <p class="kick">${esc(A.insight.kicker)}</p>
      <p class="belief">${esc(A.insight.belief)}</p>
      ${A.insight.behavior ? `<p class="behav">${esc(A.insight.behavior)}</p>` : ""}
      <button class="save" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.25)" data-save="${esc(A.insight.line)}">${saveIcon}${esc(A.labels.save)}</button>
      <img class="genii2" src="assets/genii-240.webp" alt="" width="240" height="216" loading="lazy">
    </div>
  </section>

  <div class="wrap">
  <section id="rooms" class="fade">
    <div class="roomwrap">
      <div class="roomhero"><img src="assets/island-720.webp" srcset="assets/island-720.webp 720w, assets/island-1440.webp 1440w" sizes="(min-width:1100px) 50vw, 100vw" alt="The MirrorMii island, a small city of rooms" width="720" height="342" loading="lazy"></div>
      <div>
        <p class="kick">${esc(A.rooms.kicker)}</p>
        <h2>${esc(A.rooms.title)}</h2>
        <p class="intro">${esc(A.rooms.intro)}</p>
        <div class="rooms">${A.rooms.list.map((rm) => `<div class="room"><span class="dot" style="background:${tint[rm.chapter]}"></span><div><h3>${esc(rm.room)}</h3>${rm.lines.map((l) => `<p>${l.differs ? `<span class="tagline" style="color:var(--vt)">${esc(A.rooms.differs)}</span><br>` : ""}${esc(l.line)}</p>`).join("")}</div></div>`).join("")}</div>
        ${A.rooms.flip ? `<aside class="flipbox"><h3>${esc(A.rooms.flipTitle)}</h3><p class="big">${esc(A.rooms.flip.sentence)}</p></aside>` : ""}
      </div>
    </div>
  </section>

  <section id="sides" class="fade">
    <h2>${esc(A.sides.title)}</h2>
    <p class="intro">${esc(A.sides.intro)}</p>
    <div class="sides">
      ${[A.sides.team, A.sides.clash].filter(Boolean).map((s, i) => `<div class="side ${i ? "clash" : "team"}"><span class="lab2">${esc(s.label)}</span><p class="pair">${esc(s.a)} <em aria-hidden="true">${i ? "vs" : "+"}</em> ${esc(s.b)}</p><p>${esc(s.line)}</p><small>${esc(s.aStat)}, ${esc(s.bStat)}</small></div>`).join("")}
    </div>
  </section>

  <section id="book" class="fade">
    <div class="column">
      <div>
        <div class="col-h"><img src="assets/genii-240.webp" alt="" width="54" height="54" loading="lazy"><div><p class="kick" style="margin:0">${esc(A.stings.kicker)}</p></div></div>
        <h2 style="margin-top:10px">${esc(A.stings.title)}</h2>
        <p class="intro">${esc(A.stings.intro)}</p>
        ${A.stings.lines.map((s) => `<p class="sting">${esc(s)}</p>`).join("")}
      </div>
      <div>
        <h2 style="font-size:clamp(28px,7vw,40px)">${esc(A.said.title)}</h2>
        <p class="intro">${esc(A.said.intro)}</p>
        <ul class="hearts">${A.said.hearts.map((h) => `<li>&ldquo;${esc(h.line)}&rdquo;<small>${esc(h.from)}</small></li>`).join("")}</ul>
      </div>
    </div>
  </section>

  ${r ? `<section id="record" class="fade">
    <p class="kick">${esc(r.kicker)}</p>
    <div class="record">
      <div>
        <p class="score" aria-label="${r.exact} of 8 ${esc(r.of)}">${r.exact}<sub>of 8</sub></p>
        <h2 style="margin-top:14px">${esc(r.headline)}</h2>
        <p class="intro" style="margin-bottom:0">${esc(r.intro)}</p>
      </div>
      <div>
        <ul class="calls">${r.rows.map((x) => `<li class="${x.near ? "near" : x.status}"><b>${esc(x.title)}</b><span>${esc(x.shown)}${x.side ? `, ${esc(x.side)}` : ""}</span></li>`).join("")}</ul>
        <p style="font-size:13.5px;color:var(--ink-3);margin:12px 0 0">${esc(r.key)}</p>
      </div>
    </div>
  </section>` : ""}

  <section id="party" class="fade">
    <h2>${esc(A.party.title)}</h2>
    <div class="party">
      ${A.party.click ? `<div class="slot"><span class="lab2">${esc(A.party.click.label)}</span><h3>${esc(A.party.click.name)}</h3><p>${esc(A.party.click.line)}</p></div>` : ""}
      <div class="slot opp"><span class="lab2">${esc(A.party.opposite.label)}</span><h3>${esc(A.party.opposite.a)} <span style="font-weight:300">and</span> ${esc(A.party.opposite.b)}</h3><p>${esc(A.party.opposite.line)}</p></div>
      <div class="bio"><span class="lab2" style="font:650 13px/1 var(--sans)">${esc(A.bio.title)}</span><q>${esc(A.bio.text)}</q><button id="copybio">${esc(A.bio.copy)}</button></div>
    </div>
  </section>

  <section id="end" class="fade">
    <div class="endgrid">
      <div>
        <p class="closing">${esc(A.closing)}</p>
        <p class="intro">${esc(A.share.sub)}</p>
        <div class="btns" style="justify-content:flex-start"><a class="btn primary" href="#challenge">${esc(A.share.challenge)}</a><button class="btn ghost" data-save="${esc(c.people.name + ". " + c.life.name + ".")}">${esc(A.labels.save)}</button></div>
      </div>
      <div class="sharecard" aria-label="Your card">
        <img src="assets/mirrormii-wordmark.svg" alt="" style="height:14px;filter:brightness(0) invert(1);opacity:.9">
        <div class="sarch"><div>${A.share.card.names.map((n) => `<p class="nm"><small>${esc(n.label)}</small>${esc(n.name)}</p>`).join("")}</div></div>
        <div class="chips">${A.share.card.keywords.slice(0, 5).map((k) => `<span>${esc(k)}</span>`).join("")}</div>
        <p class="inv">${esc(A.share.card.invite)}</p>
      </div>
    </div>
  </section>

  <section class="fade" style="padding-top:0">
    <div class="app">
      <img class="isl" src="assets/island-720.webp" srcset="assets/island-720.webp 720w, assets/island-1440.webp 1440w" sizes="(min-width:1100px) 45vw, 110vw" alt="MirrorMii World, the island in the game" width="720" height="342" loading="lazy">
      <p class="kick">${esc(A.app.kicker)}</p>
      <h2>${esc(A.app.title)}</h2>
      <p>${esc(A.app.body)}</p>
      <div><a class="store" href="#get-mirrormii"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.5 2-3.6-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.9-.8-3.1-.8C6.8 7.3 5.3 8.2 4.5 9.7c-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8s1.9.8 3.1.8c1.3 0 2.1-1.2 2.9-2.4.9-1.3 1.3-2.6 1.3-2.7 0 0-2.7-1-2.7-4zM14.2 5.4c.6-.8 1.1-1.9 1-3-.9 0-2.1.6-2.7 1.4-.6.7-1.1 1.8-1 2.9 1 .1 2.1-.5 2.7-1.3z"/></svg><span><small>${esc(A.app.store)}</small><b>${esc(A.app.button)}</b></span></a><p style="font-size:14px;margin:10px 0 0">${esc(A.app.note)}</p></div>
    </div>
  </section>
  </div>
  </article>
  <footer class="foot">Genii keeps your answers on this device. <a href="#data">Your data</a></footer>`;
}

const NAV = [["sheet", "Stats"], ["core", "Traits"], ["insight", "The surprise"], ["rooms", "Rooms"], ["sides", "Two sides"], ["book", "Open book"], ["record", "The record"], ["party", "Your people"], ["end", "Challenge"]];
let navIO;
function wireNav() {
  const nav = document.getElementById("secnav");
  nav.innerHTML = NAV.filter(([id]) => document.getElementById(id)).map(([id, l]) => `<a href="#${id}">${esc(l)}</a>`).join("");
  navIO && navIO.disconnect();
  navIO = new IntersectionObserver((es) => es.forEach((e) => { if (!e.isIntersecting) return; nav.querySelectorAll("a").forEach((a) => { const on = a.getAttribute("href") === `#${e.target.id}`; a.classList.toggle("on", on); if (on) nav.scrollTo({ left: a.offsetLeft - 16, behavior: "smooth" }); }); }), { rootMargin: "-35% 0px -60% 0px" });
  NAV.forEach(([id]) => { const el = document.getElementById(id); if (el) navIO.observe(el); });
}
function wire() {
  wireNav();
  // the cover glass follows the pointer or the phone's tilt: the specular band slides across the mirror
  const arch = document.getElementById("arch");
  if (!reducedMotion()) {
    const move = (x) => arch.style.setProperty("--sx", `${(x - 0.5) * 70}%`);
    addEventListener("pointermove", (e) => move(e.clientX / innerWidth), { passive: true });
    addEventListener("deviceorientation", (e) => { if (e.gamma != null) move(0.5 + e.gamma / 60); }, { passive: true });
  }
  document.querySelectorAll(".spread").forEach((sp) => {
    sp.querySelectorAll(".turn").forEach((b) => b.addEventListener("click", () => {
      const on = !sp.classList.contains("flipped");
      sp.classList.toggle("flipped", on);
      sp.querySelector(".front").setAttribute("aria-hidden", String(on));
      const back = sp.querySelector(".back");
      if (back) back.setAttribute("aria-hidden", String(!on));
      (on ? back : sp.querySelector(".front")).querySelector(".turn").focus({ preventScroll: true });
    }));
  });
  document.querySelectorAll("[data-save]").forEach((b) => b.addEventListener("click", () => openStory(b.dataset.save)));
  const cb = document.getElementById("copybio");
  cb.addEventListener("click", async () => { try { await navigator.clipboard.writeText(cb.previousElementSibling.textContent); } catch { /* clipboard blocked */ } cb.textContent = A.bio.copied; setTimeout(() => (cb.textContent = A.bio.copy), 1600); });
}
const ov = document.getElementById("ov");
function openStory(text) {
  document.getElementById("story").innerHTML = `<p>${esc(text)}</p><img src="assets/genii-240.webp" alt=""><small>mirrormii.ai</small>`;
  ov.hidden = false; document.getElementById("ovx").focus();
}
document.getElementById("ovx").addEventListener("click", () => (ov.hidden = true));
ov.addEventListener("click", (e) => { if (e.target === ov) ov.hidden = true; });
addEventListener("keydown", (e) => { if (e.key === "Escape") ov.hidden = true; });

let A = buildArticle(data, voice);
main.innerHTML = render(A);
wire();
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("loaded")));
mountVoiceSwitch(document.getElementById("voice"), voice, { voiceFun: data.newCopy.voice, voiceHeart: data.newCopy.voice }, (v) => {
  voice = v;
  const y = scrollY;
  document.body.classList.add("swapping");
  setTimeout(() => { A = buildArticle(data, v); main.innerHTML = render(A); wire(); document.body.classList.add("loaded"); scrollTo(0, y); document.body.classList.remove("swapping"); }, reducedMotion() ? 0 : 260);
});
const prog = document.getElementById("prog");
addEventListener("scroll", () => { prog.style.transform = `scaleX(${scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight)})`; }, { passive: true });
</script>
</body>
</html>
