<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Genii Tag Pilot</title>
<style>
:root{--paper:#F5F2FB;--card:#fff;--ink:#211936;--muted:#665D7E;--line:#E2DBEF;--soft:#EEE9F8;--accent:#6E4FD0;--accent-ink:#fff;--bad:#B8465A;--good:#2D8A57;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#15111F;--card:#1E1830;--ink:#ECE7F8;--muted:#A79FC0;--line:#332B49;--soft:#241D38;--accent:#A58BFF;--accent-ink:#15111F;--bad:#F08596;--good:#5CC58A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 64px;display:grid;gap:16px}
h1,h2{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:28px}h2{font-size:21px}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.opt:hover,.opt:focus-visible{border-color:var(--accent);outline:none}
.opt.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ghost{background:none;border:none;color:var(--muted);text-decoration:underline;padding:6px 0;text-align:left}
.primary{background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;padding:12px 18px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.poles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pole{background:var(--soft);border-radius:12px;padding:12px;font-size:15px}
.pole b{display:block;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 4px;font-size:13px;line-height:1.2}
.scale button:hover,.scale button:focus-visible{border-color:var(--accent);outline:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.clear{background:var(--accent);color:var(--accent-ink)}.pill.split{background:var(--bad);color:#fff}
.hit{color:var(--good);font-weight:700}.miss{color:var(--bad);font-weight:700}
textarea{width:100%;min-height:120px;font:13px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink)}
.scroll{overflow-x:auto}
@media (max-width:420px){.scale button{font-size:12px}.poles{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script src="bank.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
