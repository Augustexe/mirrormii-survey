<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 900" width="980" height="900" font-family="Figtree, system-ui, sans-serif">
  <title>Phone card layout at 390 by 844, scenario card, all answers above the fold</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8F8FF"/><stop offset="1" stop-color="#ECE9FC"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5A4ED6"/><stop offset="1" stop-color="#4A63D3"/></linearGradient>
    <radialGradient id="orb" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#C9C2F6"/><stop offset="1" stop-color="#8071E4"/></radialGradient>
  </defs>
  <rect width="980" height="900" fill="#FFFFFF"/>
  <!-- phone frame -->
  <g transform="translate(28,28)">
    <rect width="390" height="844" rx="36" fill="url(#bg)" stroke="#D9D4F5"/>
    <!-- header 52 -->
    <rect x="0" y="0" width="390" height="52" rx="0" fill="none"/>
    <text x="16" y="33" font-size="15" font-weight="700" fill="#8071E4">mirrormii</text>
    <!-- shard rail: 7 chapter groups -->
    <g transform="translate(118,22)" fill="#8071E4">
      <g opacity="1"><path d="M0 0l6 2-2 8-5-3z"/><path d="M9 0l6 2-2 8-5-3z"/><path d="M18 0l6 2-2 8-5-3z"/><path d="M27 0l6 2-2 8-5-3z" opacity=".25"/></g>
      <g transform="translate(40,0)" opacity=".25"><path d="M0 0l6 2-2 8-5-3z"/><path d="M9 0l6 2-2 8-5-3z"/><path d="M18 0l6 2-2 8-5-3z"/><path d="M27 0l6 2-2 8-5-3z"/></g>
      <g transform="translate(80,0)" opacity=".25"><path d="M0 0l6 2-2 8-5-3z"/><path d="M9 0l6 2-2 8-5-3z"/><path d="M18 0l6 2-2 8-5-3z"/></g>
      <g transform="translate(111,0)" opacity=".25"><path d="M0 0l6 2-2 8-5-3z"/><path d="M9 0l6 2-2 8-5-3z"/><path d="M18 0l6 2-2 8-5-3z"/></g>
    </g>
    <circle cx="362" cy="27" r="14" fill="none" stroke="#B3AAF0"/>
    <text x="356" y="31" font-size="12" fill="#4A4560">···</text>
    <!-- Genii line -->
    <circle cx="30" cy="80" r="12" fill="url(#orb)"/>
    <text x="50" y="85" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="15" fill="#4A4560">First instinct. I can tell when you overthink.</text>
    <!-- card sheet -->
    <rect x="12" y="104" width="366" height="648" rx="28" fill="#FFFFFF" fill-opacity=".72" stroke="#FFFFFF"/>
    <text x="32" y="138" font-size="12" font-weight="700" letter-spacing="1.4" fill="#5646C0">PICTURE THIS · YOUR PHONE</text>
    <rect x="310" y="120" width="48" height="48" rx="16" fill="#E9E6FB"/>
    <path d="M334 132l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#8071E4"/>
    <g font-family="Fraunces, Georgia, serif" font-size="26" font-weight="560" fill="#1E1B2E">
      <text x="32" y="186">Your person, totally casual:</text>
      <text x="32" y="216">"Let's swap passcodes.</text>
      <text x="32" y="246">It just feels close." They're</text>
      <text x="32" y="276">already holding their phone out.</text>
    </g>
    <!-- answers -->
    <g font-size="16" fill="#1E1B2E">
      <rect x="28" y="304" width="334" height="60" rx="18" fill="#FFFFFF" stroke="#E2DEF7"/>
      <text x="48" y="330">Type mine into their phone before</text><text x="48" y="351">they finish the sentence.</text>
      <rect x="28" y="372" width="334" height="60" rx="18" fill="url(#deep)"/>
      <text x="48" y="398" fill="#FFFFFF">Point out we already did. Two</text><text x="48" y="419" fill="#FFFFFF">years ago. They forgot.</text>
      <rect x="28" y="440" width="334" height="60" rx="18" fill="#FFFFFF" stroke="#E2DEF7"/>
      <text x="48" y="466">Offer a trade: my photos, yes.</text><text x="48" y="487">My DMs, never.</text>
      <rect x="28" y="508" width="334" height="52" rx="18" fill="#FFFFFF" stroke="#E2DEF7"/>
      <text x="48" y="539">Keep mine. "Nothing to hide. Still no."</text>
      <rect x="28" y="568" width="334" height="60" rx="18" fill="#FFFFFF" stroke="#E2DEF7"/>
      <text x="48" y="594">Laugh, change the subject, hope</text><text x="48" y="615">it never comes back.</text>
    </g>
    <g font-size="14" fill="#6E6987" font-weight="600"><text x="60" y="672">Skip</text><text x="160" y="672">Not my life</text></g>
    <line x1="28" y1="700" x2="362" y2="700" stroke="#ECE9FC"/>
    <text x="32" y="728" font-size="12" fill="#6E6987">Saved on this device</text>
    <!-- fold line -->
    <line x1="-8" y1="844" x2="398" y2="844" stroke="#E0457B" stroke-dasharray="6 4"/>
  </g>
  <!-- annotations -->
  <g font-size="13" fill="#1E1B2E">
    <text x="460" y="60" font-size="18" font-weight="700">Card, phone 390 x 844 (budget in px)</text>
    <text x="460" y="96">0 to 52: header. Wordmark 15px, shard rail (40 shards, 7 groups), menu.</text>
    <text x="460" y="118">No "Card 4 of 40", no second counter, no chapter icon ribbon.</text>
    <text x="460" y="152">68 to 92: Genii line. 24px orb, Fraunces italic 15/20, one line, 60 chars max.</text>
    <text x="460" y="186">104 to 752: one glass sheet. No nested panel, no decorative bubble.</text>
    <text x="460" y="220">Kicker: format + chapter, Figtree 12/700, tracking 0.12em, #5646C0.</text>
    <text x="460" y="242">Vignette 48px top right: device glyph (absurd) or chapter object.</text>
    <text x="460" y="264">Prompt wraps beside it, never under it.</text>
    <text x="460" y="298">Prompt: Fraunces, size by length: up to 70 chars 30px,</text>
    <text x="460" y="320">71 to 120 chars 26px, 121 to 170 chars 22px. Line height 1.14.</text>
    <text x="460" y="354">Answers: Figtree 16/21, min 52px tall, 8px gap, radius 18.</text>
    <text x="460" y="376">No A to E letter tokens. Selected: deep gradient, white text.</text>
    <text x="460" y="410">Exits: text buttons, 44px tall, #6E6987, never pill-sized.</text>
    <text x="460" y="444">Acceptance: every option and the exits sit above 844 for</text>
    <text x="460" y="466">cards with up to 5 options and prompts up to 140 chars.</text>
    <text x="460" y="488">At 375 x 667 the first two options are visible without scroll.</text>
    <text x="460" y="530" font-weight="700" fill="#E0457B">Red dashed line: the fold.</text>
  </g>
</svg>
